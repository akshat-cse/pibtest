name: PIB Daily Scraper

on:
  schedule:
    # Runs everyday at 06:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date in YYYY-MM-DD format (leave blank for previous day)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PIB Scraper
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python pib_scraper.py "${{ github.event.inputs.target_date }}"
          else
            python pib_scraper.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No new changes or files to commit."
          else
            git commit -m "Automated PIB daily fetch: $(date -d 'yesterday' '+%d-%m-%Y' 2>/dev/null || date '+%Y-%m-%d')"
            git push
          fi
