name: PIB Daily Summary

on:
  workflow_run:
    workflows: ["PIB Daily Scraper"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date in YYYY-MM-DD format (leave blank for previous day IST)'
        required: false
        default: ''
        type: string

jobs:
  summarize:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run summarizer
        env:
          SUMMARY_API_KEY: ${{ secrets.SUMMARY_API_KEY }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.target_date }}" ]; then
            echo "Manual run for date: ${{ inputs.target_date }}"
            python summarizer.py --date "${{ inputs.target_date }}"
          elif [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "Manual run (legacy inputs) for date: ${{ github.event.inputs.target_date }}"
            python summarizer.py --date "${{ github.event.inputs.target_date }}"
          else
            echo "Automated run for previous day IST"
            python summarizer.py
          fi
      - name: Commit and push summaries
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add Summaries/ || echo "No Summaries folder yet"
          if git diff --staged --quiet; then
            echo "No summary changes to commit."
          else
            TARGET_DATE="${{ inputs.target_date }}"
            if [ -z "$TARGET_DATE" ]; then
              TARGET_DATE="${{ github.event.inputs.target_date }}"
            fi
            if [ -z "$TARGET_DATE" ]; then
              TARGET_DATE=$(date -d 'yesterday' '+%Y-%m-%d' 2>/dev/null || date -v-1d '+%Y-%m-%d' 2>/dev/null || date '+%Y-%m-%d')
            fi
            git commit -m "Automated PIB summary: $TARGET_DATE"
            git push
          fi
